<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
</head>
<body>
    
    <!--Tabelas HTML-->
    <!-- <table> = Abre a tabela -->
    <!-- <thead> = Cabeçalho da tabela -->
    <!-- <tr> =Linha da tabela-->
    <!--<th> = Para cada elemento do cabealho da tabela-->
    <!--<td> = Dados da linha da tabela-->
    <!--border="1" = para a espessura das bordas da tabela, "" guarda o número da espessura-->
    <table border="1">

        <thead> <!-- Cabeçalho da tabela -->
            <tr>  <!--Linha da tabela-->
                <th>Pos</th> <!--<th> = Para cada elemento do cabealho da tabela-->
                <th>Piloto</th>
                <th>Pontos</th>
                <th>Vitórias</th>
                <th>Pódio</th>
           </tr>
        </thead> 
        <tbody> <!-- Corpo da tabela -->
            <tr>
                <td>1</td> <!--<td> = Dados da linha da tabela-->
                <td>A. Antonelli</td>
                <td>292</td>
                <td>8</td>
                <td>12</td>
            </tr>

            <tr>
                <td>2</td>
                <td>G. Russel</td>
                <td>211</td>
                <td>2</td>
                <td>7</td>

        </tbody> 
    </table>
</body>
</html>
