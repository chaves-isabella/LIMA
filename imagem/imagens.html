<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"> <!--Caractere especial para acentuação e símbolos-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagens</title> <!--Título da página que aparece na aba do navegador-->
</head>
<body>
    
    <!-- Tag para inserir imagens, src é o caminho da imagem e alt é o texto de descrição -->
    <!-- title: Texto que aparece quando o usuário passa o mouse sobre a imagem -->
    <!--Loading="lazy": adia o carregamento da imagem para quando ela estiver visível na tela-->
    <!--Draggable="false": impede que a imagem seja arrastada para outro local da página-->
    <!--Title="Escudo do Corinthians": Texto que aparece quando o usuário passa o mouse sobre a imagem-->
    <img
        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQL7F1s6PB_HjutwetJoYiFSHthN4NJUKb3AnjOOwsHKA&s=10"
        alt="Escudo do Corinthians"
        loading="lazy"
        title="Escudo do Corinthians"
        draggable="false">

</body>
</html>
