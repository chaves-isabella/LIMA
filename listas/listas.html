<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas</title>
</head>
<body>
    <!--Listas não ordenadas-->
    <!--Abre um UL para cada lista não ordenada-->
    <ul> 
        <li>Arroz</li>
        <li>Feijão</li>
        <li>Macarrão</li>
    </ul>

    <!--Lista ordenada-->
    <!--Abre um OL para cada lista não ordenada-->
    <ol> 
        <li>Alho</li>
        <li>Cebola</li>
        <li>Óleo</li>
        <li>Sal</li>
        <li>Arroz</li>
    </ol>

    <!-- Listas aninhadas-->
    <ul>
        <li>Frutas</li>
        <ul>
            <li>Morango</li>
            <li>Uva</li>
            <li>Kiwi</li>
        </ul>
    </ul>

    <ul>
        <li>Bebidas</li>
        <ul>
            <li>Refrigerante</li>
            <li>Suco</li>
            <li>Água</li>
            <ul>
                <li>Água com gás</li>
                <li>Água sem gás</li>
            </ul>
        </ul>
    </ul>

</body>
</html>
